<section class="transfer-app" id="transfer-app" aria-labelledby="transfer-app-title" hidden>
  <header class="transfer-app-header">
    <button class="xp-button transfer-back-button" type="button" id="transfer-back-to-resources">
      <span class="transfer-icon transfer-icon-download transfer-icon-back" aria-hidden="true"></span>
      <span data-transfer-copy="back">返回工具区</span>
    </button>
    <div class="transfer-app-heading">
      <span class="transfer-icon transfer-icon-app" aria-hidden="true"></span>
      <div>
        <h2 id="transfer-app-title"><span data-transfer-copy="title">临时互传</span><small class="transfer-project-version" data-project-version="1.0.5">v1.0.5</small></h2>
        <p data-transfer-copy="retention">内容在发布完成 24 小时后自动失效。</p>
      </div>
    </div>
    <span class="transfer-network-status" id="transfer-network-status" role="status">ONLINE</span>
  </header>
  <div class="transfer-feedback" id="transfer-feedback" role="status" aria-live="polite"></div>
  <div class="sr-only" id="transfer-live-summary" role="status" aria-live="polite" aria-atomic="true"></div>
  <section class="transfer-login-gate" id="transfer-login-gate" hidden>
    <span class="transfer-icon transfer-icon-lock" aria-hidden="true"></span>
    <div class="transfer-login-copy"><h3 data-transfer-copy="loginTitle">登录后使用临时互传</h3><p data-transfer-copy="loginBody">登录后会回到此处；使用同一房间口令的登录账号会进入同一个临时房间。</p></div>
    <div class="transfer-login-actions">
      <button class="xp-button transfer-login-primary" type="button" id="transfer-login-button" data-transfer-copy="loginAction">登录并继续</button>
      <button class="xp-button transfer-login-return" type="button" data-transfer-login-back data-transfer-copy="loginBack">返回工具列表</button>
    </div>
  </section>
  <section class="transfer-room-entry" id="transfer-room-entry" hidden>
    <form class="transfer-room-form" id="transfer-room-form">
      <label for="transfer-room-password" data-transfer-copy="roomPassword">房间口令</label>
      <div class="transfer-password-row">
        <input id="transfer-room-password" type="password" autocomplete="off" minlength="6" maxlength="128" required aria-describedby="transfer-security-note transfer-feedback" data-transfer-placeholder="roomPlaceholder" placeholder="至少 6 位，分享给另一位登录用户">
        <button class="xp-button" type="button" id="transfer-generate-password"><span class="transfer-icon transfer-icon-room" aria-hidden="true"></span><span data-transfer-copy="generate">随机生成</span></button>
        <button class="xp-button" type="button" id="transfer-copy-password"><span class="transfer-icon transfer-icon-copy" aria-hidden="true"></span><span data-transfer-copy="copy">复制</span></button>
      </div>
      <p class="transfer-security-note" id="transfer-security-note" data-transfer-copy="securityNote">明文口令不会发送到服务器；文字会在浏览器中使用 AES-GCM 加密。文件不使用该口令加密，只通过 HTTPS 传输、私有 R2 存储和服务端鉴权保护，且不会进行病毒扫描。请勿发送账号凭证或不可信文件。</p>
      <button class="xp-button transfer-enter-button" type="submit"><span class="transfer-icon transfer-icon-lock" aria-hidden="true"></span><span data-transfer-copy="enter">进入房间</span></button>
    </form>
    <aside class="transfer-quota-card" id="transfer-quota-card"></aside>
  </section>
  <section class="transfer-room" id="transfer-room" hidden>
    <div class="transfer-room-toolbar">
      <div><strong data-transfer-copy="roomActive">临时房间已连接</strong><span id="transfer-room-mode"></span></div>
      <div class="transfer-toolbar-actions">
        <button class="xp-button" type="button" id="transfer-refresh-button"><span class="transfer-icon transfer-icon-download" aria-hidden="true"></span><span data-transfer-copy="refresh">刷新</span></button>
        <button class="xp-button" type="button" id="transfer-leave-room" data-transfer-copy="leave">离开房间</button>
      </div>
    </div>
    <div class="transfer-feed" id="transfer-feed" role="log" aria-live="off"></div>
    <form class="transfer-compose" id="transfer-text-form">
      <div class="transfer-pending-attachments" id="transfer-pending-attachments" role="list" hidden></div>
      <div class="transfer-compose-row">
        <label class="sr-only" for="transfer-text-input" data-transfer-copy="textLabel">加密文字</label>
        <textarea id="transfer-text-input" rows="2" maxlength="10000" data-transfer-placeholder="textPlaceholder" placeholder="发送一段加密文字……"></textarea>
        <button class="xp-button transfer-send-button" id="transfer-send-button" type="submit"><span class="transfer-icon transfer-icon-text" aria-hidden="true"></span><span data-transfer-copy="send">发送</span></button>
      </div>
      <div class="transfer-upload-zone" id="transfer-upload-zone">
        <span class="transfer-icon transfer-icon-upload" aria-hidden="true"></span>
        <div class="transfer-upload-copy"><strong data-transfer-copy="dropTitle">添加照片或文件</strong><p id="transfer-upload-help"></p></div>
        <div class="transfer-picker-actions">
          <label class="xp-button transfer-file-picker transfer-photo-picker"><span class="transfer-icon transfer-icon-image" aria-hidden="true"></span><span data-transfer-copy="choosePhoto">选择照片</span><input id="transfer-photo-input" type="file" accept="image/*" multiple></label>
          <label class="xp-button transfer-file-picker"><span class="transfer-icon transfer-icon-file" aria-hidden="true"></span><span data-transfer-copy="chooseFile">选择文件</span><input id="transfer-file-input" type="file" multiple></label>
        </div>
      </div>
    </form>
    <section class="transfer-tasks" aria-labelledby="transfer-tasks-title"><h3 id="transfer-tasks-title" data-transfer-copy="tasks">上传任务</h3><div id="transfer-task-list"></div></section>
  </section>
  <div class="transfer-drop-overlay" id="transfer-drop-overlay" aria-hidden="true">
    <span class="transfer-icon transfer-icon-upload" aria-hidden="true"></span>
    <strong data-transfer-copy="dropRelease">松开以添加到待发送附件</strong>
  </div>
</section>
