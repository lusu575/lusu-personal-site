name: Production Smoke

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Wait for the expected release and check production
        run: node scripts/production-smoke.mjs
        env:
          SITE_ORIGIN: https://lusu575.com
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_ATTEMPTS: "16"
          RELEASE_RETRY_MS: "20000"
          SMOKE_ATTEMPTS: "3"
          SMOKE_RETRY_MS: "15000"
          SMOKE_TIMEOUT_MS: "10000"
          REQUIRE_WWW_REDIRECT: "0"
