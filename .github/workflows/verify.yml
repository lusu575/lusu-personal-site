name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Initialize local D1
        run: npm run d1:migrate:local

      - name: Run complete release gate
        run: npm run verify:public-site-release
        env:
          SUBPROJECT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Verify generated files are committed
        run: git diff --exit-code
